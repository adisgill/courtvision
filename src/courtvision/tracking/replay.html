<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Replay __TITLE__</title>
<style>
:root {
  --bg: #f6f5f1; --panel: #ffffff; --ink: #1c1d1f; --muted: #6a6d73; --line: #d9d6cc;
  --court: #ece4d3; --court-line: #9a8f78; --home: #2f64c8; --away: #c43d55; --ball: #f0a020;
  --accent: #1c1d1f; --made: #1d7a4c; --miss: #9a3b3b;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141517; --panel: #1d1f22; --ink: #ecebe7; --muted: #9a9ca1; --line: #34373c;
    --court: #2a2721; --court-line: #8a8170; --home: #5b8ff0; --away: #ef6b82; --ball: #f5b440;
    --accent: #ecebe7; --made: #4fbf86; --miss: #e07a7a;
  }
}
:root[data-theme="dark"] {
  --bg: #141517; --panel: #1d1f22; --ink: #ecebe7; --muted: #9a9ca1; --line: #34373c;
  --court: #2a2721; --court-line: #8a8170; --home: #5b8ff0; --away: #ef6b82; --ball: #f5b440;
  --accent: #ecebe7; --made: #4fbf86; --miss: #e07a7a;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
       font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 16px; padding: 14px 16px 6px; }
h1 { font-size: 17px; margin: 0; font-weight: 650; }
.note { color: var(--muted); font-size: 12px; }
main { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 14px; padding: 8px 16px 16px; }
@media (max-width: 860px) { main { grid-template-columns: minmax(0, 1fr); } }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
#stage { padding: 10px; }
canvas { width: 100%; height: auto; display: block; border-radius: 6px; }
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 10px; }
.score { display: flex; gap: 18px; align-items: baseline; font-variant-numeric: tabular-nums; }
.score b { font-size: 22px; }
.chip { display: inline-flex; align-items: center; gap: 6px; }
.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
button, select { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line);
                 border-radius: 6px; padding: 4px 10px; cursor: pointer; }
button:hover { border-color: var(--muted); }
input[type=range] { flex: 1; min-width: 160px; accent-color: var(--accent); }
.clock { font-variant-numeric: tabular-nums; min-width: 150px; }
#info { min-height: 22px; margin-top: 8px; color: var(--muted); }
#info b { color: var(--ink); }
aside { display: flex; flex-direction: column; max-height: 78vh; }
aside h2 { font-size: 13px; margin: 0; padding: 10px 12px; border-bottom: 1px solid var(--line); }
#shots { overflow-y: auto; flex: 1; }
.shot { display: grid; grid-template-columns: 34px 1fr 44px; gap: 8px; align-items: center;
        padding: 6px 12px; border-bottom: 1px solid var(--line); cursor: pointer; font-size: 12.5px; }
.shot:hover, .shot.on { background: var(--bg); }
.shot .xfg { text-align: right; font-variant-numeric: tabular-nums; }
.shot .res { font-weight: 650; }
.res.m { color: var(--made); } .res.x { color: var(--miss); }
.sub { color: var(--muted); font-size: 11.5px; }
</style>
</head>
<body>
<header>
  <h1 id="title"></h1>
  <span class="note">Local replay of raw 2015-16 SportVU positions: keep it on this machine (not for publishing).</span>
</header>
<main>
  <section class="panel" id="stage">
    <div class="score" id="score"></div>
    <canvas id="court" width="1880" height="1000" aria-label="Animated court"></canvas>
    <div class="bar">
      <button id="play" aria-label="Play or pause">Play</button>
      <select id="speed" aria-label="Playback speed">
        <option value="0.5">0.5×</option><option value="1" selected>1×</option>
        <option value="2">2×</option><option value="4">4×</option><option value="8">8×</option>
      </select>
      <input type="range" id="scrub" min="0" value="0" aria-label="Position in the game">
      <span class="clock" id="clock"></span>
    </div>
    <div id="info"></div>
  </section>
  <aside class="panel">
    <h2>Shots <span class="sub">chance it goes in · result</span></h2>
    <div id="shots"></div>
  </aside>
</main>
<script>
const D = __DATA__;
const raw = Uint8Array.from(atob(D.frames), c => c.charCodeAt(0));
const F = new Int16Array(raw.buffer);
const S = D.stride, N = D.n, MISS = D.missing;
const $ = id => document.getElementById(id);
$('title').textContent = `${D.teams[1]} at ${D.teams[0]}`;
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const cv = $('court'), cx = cv.getContext('2d');
const PX = 20, PAD = 0;  // 20 px per foot on a 94 x 50 court
const X = x => x * PX, Y = y => y * PX;
let frame = 0, playing = false, speed = 1, last = null, acc = 0;

function val(i, k) { const v = F[i * S + k]; return v === MISS ? null : v; }
function lineupAt(i) {
  let lo = 0, hi = D.lineups.length - 1;
  while (lo < hi) { const m = (lo + hi + 1) >> 1; if (D.lineups[m][0] <= i) lo = m; else hi = m - 1; }
  return D.lineups[lo][1];
}
function scoreAt(i) {
  const p = val(i, 0), c = val(i, 1) / 10;
  let h = 0, a = 0;
  for (const [sp, st, sh, sa] of D.score) {
    if (sp < p || (sp === p && st >= c)) { h = sh; a = sa; } else break;
  }
  return [h, a];
}
function fmt(sec) { const m = Math.floor(sec / 60), s = sec - m * 60; return `${m}:${s.toFixed(1).padStart(4, '0')}`; }

function drawCourt() {
  cx.fillStyle = css('--court'); cx.fillRect(0, 0, cv.width, cv.height);
  cx.strokeStyle = css('--court-line'); cx.lineWidth = 3;
  cx.strokeRect(X(0), Y(0), X(94), Y(50));
  cx.beginPath(); cx.moveTo(X(47), Y(0)); cx.lineTo(X(47), Y(50)); cx.stroke();
  cx.beginPath(); cx.arc(X(47), Y(25), X(6), 0, 2 * Math.PI); cx.stroke();
  for (const side of [0, 1]) {
    const hx = side ? 88.75 : 5.25, base = side ? 94 : 0, dir = side ? -1 : 1;
    cx.strokeRect(X(side ? 94 - 19 : 0), Y(17), X(19), Y(16));            // the key
    cx.beginPath(); cx.arc(X(base + dir * 19), Y(25), X(6), 0, 2 * Math.PI); cx.stroke();
    cx.beginPath(); cx.arc(X(hx), Y(25), X(4), side ? Math.PI / 2 : -Math.PI / 2,
                           side ? 3 * Math.PI / 2 : Math.PI / 2); cx.stroke();  // restricted
    const a = Math.asin(22 / 23.75);
    cx.beginPath();
    cx.moveTo(X(base), Y(3)); cx.lineTo(X(base + dir * 14), Y(3));
    if (side) cx.arc(X(hx), Y(25), X(23.75), Math.PI + a, Math.PI - a, true);
    else cx.arc(X(hx), Y(25), X(23.75), -a, a, true);
    cx.moveTo(X(base + dir * 14), Y(47)); cx.lineTo(X(base), Y(47)); cx.stroke();
    cx.beginPath(); cx.moveTo(X(base + dir * 4), Y(22)); cx.lineTo(X(base + dir * 4), Y(28)); cx.stroke();
    cx.beginPath(); cx.arc(X(hx), Y(25), X(0.75), 0, 2 * Math.PI); cx.stroke();
  }
}

function currentShot(i) {
  // a shot shows from its release until 2 s later
  for (const s of D.shots) if (i >= s.frame && i <= s.frame + 50) return s;
  return null;
}

function draw() {
  const i = frame;
  drawCourt();
  const ids = lineupAt(i);
  const shot = currentShot(i);
  if (shot) {  // shooter to closest defender, at the release
    const k = ids.indexOf(shot.person_id);
    if (k >= 0) {
      const sx = val(shot.frame, 6 + 2 * k) / 10, sy = val(shot.frame, 7 + 2 * k) / 10;
      let best = null;
      for (let j = 0; j < 10; j++) {
        if ((j < 5) === (k < 5)) continue;
        const x = val(shot.frame, 6 + 2 * j), y = val(shot.frame, 7 + 2 * j);
        if (x === null) continue;
        const d = Math.hypot(x / 10 - sx, y / 10 - sy);
        if (!best || d < best.d) best = { d, x: x / 10, y: y / 10 };
      }
      if (best) {
        cx.setLineDash([10, 8]); cx.strokeStyle = css('--ink'); cx.lineWidth = 3;
        cx.beginPath(); cx.moveTo(X(sx), Y(sy)); cx.lineTo(X(best.x), Y(best.y)); cx.stroke();
        cx.setLineDash([]);
      }
      cx.beginPath(); cx.arc(X(sx), Y(sy), X(2.1), 0, 2 * Math.PI);
      cx.strokeStyle = css('--ink'); cx.lineWidth = 4; cx.stroke();
    }
  }
  for (let j = 0; j < 10; j++) {
    const x = val(i, 6 + 2 * j), y = val(i, 7 + 2 * j);
    if (x === null || !ids[j]) continue;
    cx.beginPath(); cx.arc(X(x / 10), Y(y / 10), X(1.35), 0, 2 * Math.PI);
    cx.fillStyle = css(j < 5 ? '--home' : '--away'); cx.fill();
    cx.lineWidth = 3; cx.strokeStyle = css('--panel'); cx.stroke();
    const p = D.players[ids[j]];
    cx.fillStyle = '#ffffff'; cx.font = `700 ${PX * 1.25}px system-ui, sans-serif`;
    cx.textAlign = 'center'; cx.textBaseline = 'middle';
    cx.fillText(p ? p.jersey : '?', X(x / 10), Y(y / 10) + 1);
  }
  const bx = val(i, 3), by = val(i, 4), bz = val(i, 5);
  if (bx !== null) {
    const r = 0.55 + Math.max(0, (bz || 0) / 10) / 14;
    cx.beginPath(); cx.arc(X(bx / 10), Y(by / 10), X(r), 0, 2 * Math.PI);
    cx.fillStyle = css('--ball'); cx.fill(); cx.lineWidth = 3; cx.strokeStyle = '#3a2a10'; cx.stroke();
  }
  const [h, a] = scoreAt(i);
  $('score').innerHTML =
    `<span class="chip"><span class="dot" style="background:var(--away)"></span>${D.teams[1]} <b>${a}</b></span>` +
    `<span class="chip"><span class="dot" style="background:var(--home)"></span>${D.teams[0]} <b>${h}</b></span>`;
  const sc = val(i, 2);
  $('clock').textContent = `Q${val(i, 0)} ${fmt(val(i, 1) / 10)} · shot ${sc === null ? '–' : (sc / 10).toFixed(1)}`;
  $('scrub').value = i;
  if (shot) {
    const p = D.players[shot.person_id];
    const bits = [];
    if (shot.xfg !== null) bits.push(`<b>${Math.round(shot.xfg * 100)}%</b> chance it goes in`);
    if (shot.closest_def !== null) bits.push(`closest defender <b>${shot.closest_def} ft</b>`);
    if (shot.catch_shoot) bits.push('catch-and-shoot');
    else if (shot.dribbles) bits.push(`${shot.dribbles} dribble${shot.dribbles > 1 ? 's' : ''}`);
    $('info').innerHTML = `${p ? p.name : ''}: ${bits.join(' · ')} → <b>${shot.made ? 'made' : 'missed'}</b>`;
  } else $('info').textContent = '';
  document.querySelectorAll('.shot').forEach(el => el.classList.toggle('on', shot && +el.dataset.f === shot.frame));
}

function tick(t) {
  if (!playing) { last = null; return; }
  if (last !== null) {
    acc += (t - last) / 40 * speed;
    const step = Math.floor(acc); acc -= step;
    frame = Math.min(N - 1, frame + step);
    if (frame >= N - 1) toggle(false);
  }
  last = t; draw(); requestAnimationFrame(tick);
}
function toggle(on) { playing = on ?? !playing; $('play').textContent = playing ? 'Pause' : 'Play'; if (playing) requestAnimationFrame(tick); }
function seek(i) { frame = Math.max(0, Math.min(N - 1, i)); draw(); }

$('scrub').max = N - 1;
$('scrub').addEventListener('input', e => seek(+e.target.value));
$('play').addEventListener('click', () => toggle());
$('speed').addEventListener('change', e => { speed = +e.target.value; });
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  if (e.code === 'Space') { e.preventDefault(); toggle(); }
  if (e.code === 'ArrowRight') seek(frame + 25);
  if (e.code === 'ArrowLeft') seek(frame - 25);
});
const list = $('shots');
for (const s of D.shots) {
  const p = D.players[s.person_id];
  const el = document.createElement('div');
  el.className = 'shot'; el.dataset.f = s.frame;
  const c = val(s.frame, 1) / 10;
  el.innerHTML = `<span class="res ${s.made ? 'm' : 'x'}">${s.made ? 'Made' : 'Miss'}</span>` +
    `<span>${p ? p.name : s.person_id}<br><span class="sub">Q${s.period} ${fmt(c)} · ${s.three ? '3PT' : '2PT'}${s.closest_def !== null ? ' · def ' + s.closest_def + ' ft' : ''}</span></span>` +
    `<span class="xfg">${s.xfg === null ? '–' : Math.round(s.xfg * 100) + '%'}</span>`;
  el.addEventListener('click', () => { toggle(false); seek(s.frame - 75); });
  list.appendChild(el);
}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', draw);
draw();
</script>
</body>
</html>
