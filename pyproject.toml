[project]
name = "courtvision"
version = "0.1.0"
description = "Rate and visualize NBA teams, games, and players on a common 0-100 scale across six dimensions."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
authors = [{ name = "Adi Gill" }]
keywords = ["nba", "basketball", "analytics", "duckdb"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "duckdb>=1.1",
    "kaggle>=1.7.4",
    "nba_api>=1.10",
    "pandas>=2.2",
    "polars>=1.9",
    "pyarrow>=17",
    "python-dotenv>=1.0",
    # kaggle 2.2.x imports `six` without declaring it; remove once upstream fixes it.
    "six>=1.16",
    "typer>=0.12",
]

[project.scripts]
courtvision = "courtvision.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/courtvision"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "network: test hits a live external API (deselected by default)",
    "integration: needs the built database (`courtvision metrics build`); skipped otherwise",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.ruff.lint.per-file-ignores]
# One formula per line reads better than wrapped SQL fragments.
"src/courtvision/metrics/measures.py" = ["E501"]
"src/courtvision/metrics/sql.py" = ["E501"]
